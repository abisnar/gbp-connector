name: Release

# Fires when a SemVer tag is pushed (e.g. ``git tag v0.1.0 && git push --tags``).
# Three jobs run in series:
#   1. build         — produces sdist + wheel from the tagged commit
#   2. publish-pypi  — uploads to PyPI via OIDC (Trusted Publishing, no token)
#   3. github-release — attaches the same artifacts to a GitHub Release
#
# See docs/releasing.md for the one-time PyPI Trusted Publisher setup.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never abort a release mid-flight

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # hatch-vcs reads the tag list to compute the version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Create venv (Python 3.12)
        run: uv venv --python 3.12

      - name: Install build frontend
        run: uv pip install build

      - name: Build sdist + wheel
        run: .venv/bin/python -m build

      - name: Verify built version matches tag
        # Belt and suspenders: hatch-vcs derives the version from the tag, but
        # if the tag and the resulting wheel filename ever disagreed we'd want
        # the release to fail loudly, not silently publish the wrong version.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ls dist/
          if ! ls dist/ | grep -q "gbp_connector-${TAG}"; then
            echo "Built artifact does not match tag v${TAG}" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The "pypi" environment is referenced by the PyPI Trusted Publisher
    # config; using it also lets you require manual approval per release if
    # you ever want to add that gate in repo settings.
    environment:
      name: pypi
      url: https://pypi.org/project/gbp-connector/
    permissions:
      # OIDC ID token for Trusted Publishing — no PyPI API token needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI auto-detects OIDC from id-token: write — no `password:` field.
          print-hash: true

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Create release with built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pull the matching section out of CHANGELOG.md, if it exists.
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="$(mktemp)"
          if grep -q "^## \[${TAG#v}\]" CHANGELOG.md; then
            awk "/^## \[${TAG#v}\]/{flag=1;next} /^## /{flag=0} flag" \
                CHANGELOG.md > "$NOTES_FILE"
          else
            echo "See CHANGELOG.md and the commit history for changes in this release." > "$NOTES_FILE"
          fi
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --verify-tag
