name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs — saves CI minutes on rapid push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The setup-uv cache is keyed off pyproject.toml because this is a library —
# we deliberately don't check in a uv.lock (resolution is the consumer's job).
env:
  UV_CACHE_GLOB: pyproject.toml

jobs:
  lint-and-type:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: ${{ env.UV_CACHE_GLOB }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project (dev extras)
        run: uv pip install --system -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: mypy
        run: mypy

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: ${{ env.UV_CACHE_GLOB }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project (dev extras)
        run: uv pip install --system -e ".[dev]"

      - name: Run unit tests
        # Default pytest excludes integration/live tests — see tests/conftest.py.
        run: pytest

  integration-mock:
    name: Integration tests (Prism mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: ${{ env.UV_CACHE_GLOB }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project (dev extras)
        run: uv pip install --system -e ".[dev]"

      - name: Install Prism mock server
        run: npm install -g @stoplight/prism-cli@latest

      - name: Start Prism on :4010
        run: |
          prism mock openapi/google-business-profile.yaml --port 4010 > prism.log 2>&1 &
          echo $! > prism.pid
          # Wait for prism to bind (max ~20s).
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null -H "Authorization: Bearer test" \
                "http://localhost:4010/accounts"; then
              echo "prism is ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "prism did not start in time" >&2
          cat prism.log
          exit 1

      - name: Run integration tests against mock
        env:
          GBP_MOCK_BASE_URL: http://localhost:4010
        run: pytest tests/integration --run-integration

      - name: Stop Prism
        if: always()
        run: |
          if [ -f prism.pid ]; then kill "$(cat prism.pid)" || true; fi

      - name: Upload Prism log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prism-log
          path: prism.log
          if-no-files-found: ignore

  openapi:
    name: Validate OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@latest

      - name: Lint OpenAPI spec
        run: redocly lint openapi/google-business-profile.yaml

  secret-scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
