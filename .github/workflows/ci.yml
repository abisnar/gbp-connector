name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs — saves CI minutes on rapid push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-type:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Create venv (Python 3.12)
        run: uv venv --python 3.12

      - name: Install project (dev extras)
        # No --system: PEP 668 makes Ubuntu's /usr Python externally managed,
        # and a venv is the right place for CI deps anyway.
        run: uv pip install -e ".[dev]"

      - name: Ruff (lint)
        run: .venv/bin/ruff check .

      - name: Ruff (format check)
        run: .venv/bin/ruff format --check .

      - name: mypy
        run: .venv/bin/mypy

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Create venv (Python ${{ matrix.python-version }})
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install project (dev extras)
        run: uv pip install -e ".[dev]"

      - name: Run unit tests
        # Default pytest excludes integration/live tests — see tests/conftest.py.
        run: .venv/bin/pytest

  integration-mock:
    name: Integration tests (Prism mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Create venv (Python 3.12)
        run: uv venv --python 3.12

      - name: Install project (dev extras)
        run: uv pip install -e ".[dev]"

      - name: Install Prism mock server
        # Pinned to 5.5.4: newer prism-cli has an ESM/CommonJS conflict with
        # @faker-js/faker on Node 20+ (see stoplight/prism#2604).
        run: npm install -g @stoplight/prism-cli@5.5.4

      - name: Start Prism on :4010
        run: |
          prism mock openapi/google-business-profile.yaml --port 4010 > prism.log 2>&1 &
          echo $! > prism.pid
          # Wait for prism to bind (max ~30s).
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null -H "Authorization: Bearer test" \
                "http://localhost:4010/accounts"; then
              echo "prism is ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "prism did not start in time" >&2
          cat prism.log
          exit 1

      - name: Run integration tests against mock
        env:
          GBP_MOCK_BASE_URL: http://localhost:4010
        run: .venv/bin/pytest tests/integration --run-integration -v

      - name: Stop Prism
        if: always()
        run: |
          if [ -f prism.pid ]; then kill "$(cat prism.pid)" || true; fi

      - name: Upload Prism log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prism-log
          path: prism.log
          if-no-files-found: ignore

  openapi:
    name: Validate OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@latest

      - name: Lint OpenAPI spec
        run: redocly lint openapi/google-business-profile.yaml

  secret-scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit, not just the diff.
          fetch-depth: 0

      - name: Install gitleaks
        # Pinned binary (not the gitleaks-action wrapper, which has had checkout
        # auth issues on public personal-account repos).
        run: |
          VERSION=8.18.4
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repo and full history
        run: gitleaks detect --source . --redact --verbose --no-banner --exit-code 1
