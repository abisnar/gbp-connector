[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gbp-connector"
# Version is derived from the most recent git tag (vX.Y.Z) by hatch-vcs.
# See [tool.hatch.version] below and docs/releasing.md.
dynamic = ["version"]
description = "A SOLID Python client for the Google Business Profile API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Allan Bisnar" }]
requires-python = ">=3.11"
keywords = ["google", "business-profile", "gmb", "api", "connector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/abisnar/gbp-connector"
Issues = "https://github.com/abisnar/gbp-connector/issues"
"OpenAPI Spec" = "https://github.com/abisnar/gbp-connector/blob/main/openapi/google-business-profile.yaml"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
# Generated file — gitignored. Imported by gbp_connector/__init__.py.
version-file = "src/gbp_connector/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gbp_connector"]

[tool.hatch.build.targets.sdist]
# Don't ship test/CI/dev clutter in the source distribution.
exclude = [
    "/.github",
    "/tests",
    "/examples",
    "/docs",
    "/.venv",
    "/.coverage",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B018"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=gbp_connector --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "integration: hits an HTTP server (real or mocked); needs --run-integration to run",
    "live: hits real Google APIs with credentials from the environment; needs --run-live",
]
